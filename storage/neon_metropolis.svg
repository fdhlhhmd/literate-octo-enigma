<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="70%" stop-color="#180e29"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#night)"/>
  <!-- Skyline silhouettes -->
  <rect x="50" y="240" width="80" height="300" fill="#111827"/>
  <rect x="150" y="180" width="90" height="360" fill="#0f172a"/>
  <line x1="195" y1="120" x2="195" y2="180" stroke="#f43f5e" stroke-width="3"/>
  <rect x="260" y="280" width="70" height="260" fill="#1e1b4b"/>
  <rect x="350" y="150" width="110" height="390" fill="#090d16"/>
  <line x1="405" y1="90" x2="405" y2="150" stroke="#06b6d4" stroke-width="4"/>
  <rect x="480" y="220" width="85" height="320" fill="#111827"/>
  <rect x="590" y="190" width="100" height="350" fill="#1e1b4b"/>
  <rect x="710" y="270" width="70" height="270" fill="#0f172a"/>
  <!-- Neon glowing windows & signage -->
  <rect x="165" y="200" width="60" height="6" fill="#ec4899" filter="drop-shadow(0 0 6px #ec4899)"/>
  <rect x="370" y="180" width="70" height="8" fill="#06b6d4" filter="drop-shadow(0 0 8px #06b6d4)"/>
  <rect x="500" y="250" width="45" height="6" fill="#a855f7" filter="drop-shadow(0 0 6px #a855f7)"/>
  <rect x="610" y="220" width="60" height="6" fill="#f43f5e" filter="drop-shadow(0 0 6px #f43f5e)"/>
  <!-- Road reflection -->
  <rect y="480" width="800" height="120" fill="#0a0a14"/>
  <ellipse cx="400" cy="540" rx="350" ry="25" fill="#a855f7" opacity="0.25"/>
  <ellipse cx="200" cy="550" rx="180" ry="15" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="600" cy="550" rx="200" ry="15" fill="#06b6d4" opacity="0.3"/>
  <rect y="540" width="800" height="60" fill="#000000" opacity="0.85"/>
  <text x="400" y="580" fill="#f472b6" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" letter-spacing="3">URBAN NIGHTS • TOKYO CYBER</text>
</svg>