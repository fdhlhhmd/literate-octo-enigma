<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="csky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="csea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="crock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#csky)"/>
  <circle cx="680" cy="140" r="55" fill="#fef08a" opacity="0.9" filter="drop-shadow(0 0 20px #fde047)"/>
  <!-- Sea -->
  <rect y="320" width="800" height="280" fill="url(#csea)"/>
  <!-- Waves -->
  <path d="M0,330 Q200,320 400,335 T800,325 L800,350 L0,350 Z" fill="#7dd3fc" opacity="0.4"/>
  <path d="M0,370 Q180,360 420,375 T800,365 L800,390 L0,390 Z" fill="#38bdf8" opacity="0.3"/>
  <!-- Coastal Arch Rock -->
  <path d="M80,600 L120,280 Q220,160 380,210 Q500,250 540,600 L440,600 Q400,360 330,340 Q250,320 220,600 Z" fill="url(#crock)"/>
  <!-- Distant cliffs -->
  <polygon points="560,330 650,260 760,330" fill="#0f766e" opacity="0.7"/>
  <rect y="540" width="800" height="60" fill="#0c4a6e" opacity="0.85"/>
  <text x="400" y="580" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" letter-spacing="3">MEDITERRANEAN • AZURE COASTAL ARCH</text>
</svg>