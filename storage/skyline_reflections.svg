<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" fill="url(#sky3)"/>
  <circle cx="200" cy="140" r="40" fill="#f1f5f9" opacity="0.9" filter="drop-shadow(0 0 20px #e2e8f0)"/>
  <!-- Skyline -->
  <polygon points="50,380 90,260 130,380" fill="#1e293b"/>
  <rect x="140" y="210" width="60" height="170" fill="#334155"/>
  <rect x="220" y="160" width="80" height="220" fill="#1e293b"/>
  <rect x="320" y="230" width="70" height="150" fill="#334155"/>
  <rect x="410" y="180" width="100" height="200" fill="#1e293b"/>
  <rect x="530" y="240" width="60" height="140" fill="#334155"/>
  <rect x="610" y="150" width="90" height="230" fill="#1e293b"/>
  <!-- Bridge suspension cables -->
  <path d="M0,320 Q200,340 400,300 T800,320" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Water with reflection -->
  <rect y="380" width="800" height="220" fill="url(#water)"/>
  <line x1="200" y1="380" x2="200" y2="520" stroke="#f1f5f9" stroke-width="4" opacity="0.3" stroke-dasharray="10 8"/>
  <line x1="460" y1="380" x2="460" y2="530" stroke="#38bdf8" stroke-width="6" opacity="0.4" stroke-dasharray="8 6"/>
  <line x1="655" y1="380" x2="655" y2="530" stroke="#f59e0b" stroke-width="5" opacity="0.4" stroke-dasharray="6 10"/>
  <rect y="540" width="800" height="60" fill="#000000" opacity="0.85"/>
  <text x="400" y="580" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" letter-spacing="3">URBAN NIGHTS • HARBOR SKYLINE</text>
</svg>