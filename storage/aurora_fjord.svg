<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="asky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#asky)"/>
  <!-- Stars -->
  <circle cx="100" cy="80" r="1.5" fill="#fff"/>
  <circle cx="250" cy="50" r="2" fill="#fff"/>
  <circle cx="450" cy="90" r="1.5" fill="#fff"/>
  <circle cx="620" cy="70" r="2" fill="#fff"/>
  <circle cx="720" cy="120" r="1.5" fill="#fff"/>
  <!-- Aurora Ribbons -->
  <path d="M-50,140 Q200,60 450,180 T850,100 L850,220 Q550,280 300,160 T-50,240 Z" fill="url(#aurora)" filter="drop-shadow(0 0 15px #4ade80)"/>
  <!-- Fjord Mountains -->
  <polygon points="-50,600 150,290 380,600" fill="#0f172a"/>
  <polygon points="150,290 190,360 110,360" fill="#ffffff" opacity="0.8"/>
  <polygon points="320,600 520,260 720,600" fill="#022c22"/>
  <polygon points="520,260 560,330 480,330" fill="#ffffff" opacity="0.8"/>
  <polygon points="580,600 740,310 850,600" fill="#0f172a"/>
  <!-- Fjord Water reflection -->
  <rect y="440" width="800" height="160" fill="#020617"/>
  <ellipse cx="400" cy="520" rx="280" ry="25" fill="#2dd4bf" opacity="0.25" filter="drop-shadow(0 0 20px #2dd4bf)"/>
  <rect y="540" width="800" height="60" fill="#000000" opacity="0.85"/>
  <text x="400" y="580" fill="#86efac" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" letter-spacing="3">NORDIC WONDERS • ARCTIC AURORA</text>
</svg>